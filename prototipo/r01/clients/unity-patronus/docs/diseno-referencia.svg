  <rect x="32" y="140" width="296" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="46" y="168" fill="#64748B" font-size="14">http://10.0.2.2:8000</text>

  <rect x="32" y="196" width="143" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
