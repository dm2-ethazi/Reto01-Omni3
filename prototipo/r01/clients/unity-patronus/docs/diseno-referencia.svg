<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="cabecera" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="#F1F5F9"/>

  <!-- Cabecera -->
  <rect x="0" y="0" width="360" height="86" fill="url(#cabecera)"/>
