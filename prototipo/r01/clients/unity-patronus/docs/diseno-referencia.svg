  <rect x="185" y="196" width="143" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="199" y="224" fill="#64748B" font-size="14">DNI</text>

  <!-- Fila de botones 1 -->
  <rect x="32" y="254" width="94" height="44" rx="12" fill="#1E3A8A"/>
  <text x="79" y="281" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Conectar</text>
  <rect x="133" y="254" width="94" height="44" rx="12" fill="#FFFFFF" stroke="#1E3A8A"/>
  <text x="180" y="281" fill="#1E3A8A" font-size="13" font-weight="bold" text-anchor="middle">Buscar</text>
  <rect x="234" y="254" width="94" height="44" rx="12" fill="#FFFFFF" stroke="#1E3A8A"/>
  <text x="281" y="281" fill="#1E3A8A" font-size="13" font-weight="bold" text-anchor="middle">DNI</text>

  <!-- Fila de botones 2 -->
  <rect x="32" y="306" width="143" height="44" rx="12" fill="#FFFFFF" stroke="#1E3A8A"/>
  <text x="103" y="333" fill="#1E3A8A" font-size="13" font-weight="bold" text-anchor="middle">Salud</text>
  <rect x="185" y="306" width="143" height="44" rx="12" fill="#1E3A8A"/>
  <text x="256" y="333" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Sincronizar</text>

  <!-- Chip estado -->
  <rect x="16" y="370" width="328" height="34" rx="17" fill="#E0E7FF" stroke="#1E3A8A"/>
  <text x="180" y="392" fill="#172554" font-size="13" font-weight="bold" text-anchor="middle">Central: 40 filas · backend=ok</text>

  <!-- Lista de resultados -->
